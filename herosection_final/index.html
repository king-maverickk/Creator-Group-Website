<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamilton Creative Group - Hero Section</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Gochi+Hand&family=Inter:wght@400;700;800&family=Outfit:wght@400;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    
    <!-- GSAP & Draggable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div id="dot-background"></div>

    <main class="hero-container">
        <!-- Header Text -->
        <div class="top-label">ALL THINGS DIGITAL MEDIA</div>

        <!-- Main Hero Title -->
        <div class="hero-title-wrapper">
            <h1 id="hero-title">
                <span class="line">HAMILTON</span>
                <span class="line">CREATIVE</span>
                <span class="line">GROUP</span>
            </h1>
        </div>

        <!-- Stickers & 3D Symbols -->
        <div id="sticker-layer">
            <!-- Hey Pill -->
            <div class="sticker pill blue-pill draggable float-anim" style="top: 15%; left: 15%;">
                <span class="emoji">👋</span> Hey
            </div>

            <!-- Welcome Note -->
            <div class="sticker handwritten welcome-note draggable float-anim" style="top: 20%; right: 15%;">
                Welcome to<br>the club!
            </div>

            <!-- Handshake 3D -->
            <img src="assets/Hero/image-6CPt9hgvMc5c6jWjjFb0lT3fS3BG7B.png" alt="Handshake" class="sticker symbol-3d draggable float-anim invisible-on-mobile" style="bottom: 8%; right: 8%; width: 120px;">

            <!-- Doodle Note -->
            <div class="sticker handwritten draggable float-anim" style="top: 50%; left: 10%; color: var(--brand-green); font-family: var(--font-hand-bold);">
                Fresh ideas<br>daily *
            </div>

            <!-- Yellow Folder 3D -->
            <img src="assets/Hero/image-6TJq3TblGrgJLKvMLFj3N2YcDEXG2A.png" alt="Folder" class="sticker symbol-3d draggable float-anim" style="bottom: 5%; left: 35%; width: 70px;">

            <!-- Blue Pen 3D -->
            <img src="assets/Hero/image-7eY46656OfQTGesaktlYzD5LcKT2bK.png" alt="Blue Pen" class="sticker symbol-3d draggable float-anim pen" style="top: 5%; right: -20px; width: 180px; transform: rotate(-15deg);">

            <!-- White Stylus 3D -->
            <img src="assets/Hero/image-oVb0xRykYeRBIg1JrWVrsMS5wxUklJ.png" alt="Stylus" class="sticker symbol-3d draggable float-anim pen invisible-on-mobile" style="top: 15%; right: 20px; width: 160px; transform: rotate(10deg);">

            <!-- Meet Up Pill -->
            <div class="sticker pill yellow-pill draggable float-anim" style="bottom: 25%; right: 20%;">
                Meet Up: TBA
            </div>

            <!-- Emoticons -->
            <div class="sticker emoticon draggable float-anim" style="top: 45%; right: 10%;">:)</div>
            <div class="sticker emoticon draggable float-anim" style="top: 52%; right: 12%;">;)</div>
            <div class="sticker emoticon draggable float-anim" style="top: 50%; right: 8%;">:<</div>
            <div class="sticker emoticon draggable float-anim" style="bottom: 10%; right: 40%; transform: rotate(15deg);">^__^</div>
            <div class="sticker emoticon draggable float-anim" style="top: 10%; left: 45%; transform: rotate(-20deg);">O_O</div>

            <!-- Tablet Screenshot (Simulated) -->
            <div class="sticker tablet-frame draggable float-anim invisible-on-mobile" style="bottom: 10%; left: 10%;">
                <img src="assets/Hero/screenshot-app.png" alt="Work Sample">
            </div>

            <!-- Additional Inspo Screenshots as "Sticky Notes" -->
            <div class="sticker sticker-note draggable float-anim invisible-on-mobile" style="top: 35%; left: 5%; transform: rotate(-10deg); border-radius: 12px; overflow: hidden;">
                <img src="assets/Hero/Android Large - 32.png" alt="Inspo 1" style="height: 150px; border: 8px solid white; box-shadow: 5px 5px 15px rgba(0,0,0,0.1);">
            </div>

            <div class="sticker sticker-note draggable float-anim" style="bottom: 20%; right: 5%; transform: rotate(8deg); border-radius: 12px; overflow: hidden;">
                <img src="assets/Hero/inspo 2 - the absolute positioned stickers.jpg" alt="Inspo 2" style="height: 130px; border: 4px solid ivory; box-shadow: 5px 5px 15px rgba(0,0,0,0.1); border-radius: 12px;">
            </div>

            <!-- Oversized Cursor (Decorative) -->
            <div class="sticker custom-cursor invisible-on-mobile" style="bottom: 15%; right: 35%;">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.66208 2.00001C5.3514 1.99044 5.04746 2.08643 4.80931 2.26939C4.57116 2.45235 4.41315 2.7113 4.36597 3.00001L4.0001 20.0001C3.99014 20.4658 4.21247 20.9038 4.5873 21.171C4.96213 21.4383 5.44391 21.5015 5.8751 21.3401L10.5001 19.6001L14.2931 22.7141C14.4812 22.8681 14.7138 22.9614 14.9587 22.9814C15.2035 23.0014 15.4501 22.9472 15.6648 22.8264C15.8795 22.7056 16.0532 22.5233 16.1621 22.3041C16.2711 22.085 16.3104 21.8383 16.2751 21.5981L15.5001 16.3001L20.1251 14.5601C20.5563 14.3987 20.8871 14.0535 20.9851 13.6101C21.0831 13.1667 20.9355 12.7011 20.5931 12.4001L5.66208 2.00001Z" fill="#161A1D" stroke="white" stroke-width="1"/>
                </svg>
            </div>
        </div>

        <!-- Footer Text -->
        <div class="bottom-label">MEET UP: TBA</div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
